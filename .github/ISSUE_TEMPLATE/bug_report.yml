name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL, device and browser, or "local dev".
  - type: textarea
    id: extra
    attributes:
      label: Logs or screenshots
