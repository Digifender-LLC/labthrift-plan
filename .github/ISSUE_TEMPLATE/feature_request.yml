name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed change
  - type: input
    id: roadmap
    attributes:
      label: Roadmap item
      description: ID from docs/ROADMAP.md in tech-dose, if there is one.
